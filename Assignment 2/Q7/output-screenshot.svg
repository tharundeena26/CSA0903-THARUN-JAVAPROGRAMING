<text x="125" y="49" font-family="monospace" font-size="20" fill="#c7d2e2">TERMINAL OUTPUT - Q7</text>
<text x="48" y="88" font-family="monospace" font-size="17" fill="#edf2f7">Q7 - Diagnose and validate a StringBuilder redesign</text>
<text x="48" y="112" font-family="monospace" font-size="17" fill="#edf2f7">Workload: 500 tickets x 80 fields</text>
<text x="48" y="136" font-family="monospace" font-size="17" fill="#edf2f7">Original repeated + average ns: 16049397</text>
<text x="48" y="160" font-family="monospace" font-size="17" fill="#edf2f7">Redesigned StringBuilder average ns: 1029939</text>
<text x="48" y="184" font-family="monospace" font-size="17" fill="#edf2f7">Checksum: 4286800</text>
<text x="48" y="208" font-family="monospace" font-size="17" fill="#edf2f7">Objective: reduce repeated temporary String creation and character copying.</text>
<text x="48" y="232" font-family="monospace" font-size="17" fill="#edf2f7">Complexity: repeated concatenation can copy O(n^2) characters; StringBuilder is O(n) amortized.</text>
<text x="48" y="256" font-family="monospace" font-size="17" fill="#edf2f7">Measurements vary by JVM and hardware; repeat runs before drawing conclusions.</text>
