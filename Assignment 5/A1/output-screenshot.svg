<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="290" viewBox="0 0 1400 290"><rect width="1400" height="290" fill="#171b24"/><rect x="20" y="20" width="1360" height="250" rx="16" fill="#202633" stroke="#64748b"/><circle cx="48" cy="48" r="7" fill="#f87171"/><circle cx="72" cy="48" r="7" fill="#fbbf24"/><circle cx="96" cy="48" r="7" fill="#4ade80"/><text x="130" y="55" font-family="monospace" font-size="21" fill="#cbd5e1">A1 – Bus Pass File Format</text><text x="55" y="108" font-family="monospace" font-size="18" fill="#f1f5f9">Text record: passId|regNo|name|route|stop|validUntil|amount|checksum</text><text x="55" y="143" font-family="monospace" font-size="18" fill="#f1f5f9">Binary record: UTF fields + int route + epoch day + double amount</text><text x="55" y="178" font-family="monospace" font-size="18" fill="#f1f5f9">Find by ID: O(n) scan; fixed-record indexed seek: O(1)</text></svg>